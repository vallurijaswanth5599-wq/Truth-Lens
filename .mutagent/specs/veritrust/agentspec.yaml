evaluation:
criteria:
- id: evidence-quality
description: "For each material conclusion, the report uses multiple relevant trusted sources where available and cites them accurately."
type: llm-judge
goal: "No material conclusion rests on unsupported or misrepresented evidence."
- id: verification-accuracy
description: "The report correctly classifies true, false, misleading, AI-generated, manipulated, scam, insufficient-evidence, and expert-review cases."
type: llm-judge
goal: "Correct classification for each evaluation case."
- id: explainable-decision
description: "The report clearly explains verified and unverified claims, supporting and contradicting evidence, uncertainty, and why its scores and recommendation follow."
type: llm-judge
goal: "Every final recommendation is understandable and traceable to evidence."
- id: calibrated-scores
description: "Credibility and confidence scores fall within plus or minus 10 points of the expected range and do not overstate weak or conflicting evidence."
type: llm-judge
goal: "Scores are calibrated and uncertainty-sensitive."
- id: safe-failure
description: "The agent never fabricates evidence, treats tool failures as evidence, or forces a conclusion when evidence is inadequate; high-impact claims carry appropriate informational warnings."
type: llm-judge
goal: "Zero unsafe or unsupported definitive conclusions."
- id: actionable-recommendation
description: "The agent gives exactly one appropriate recommendation: Safe to Share, Share with Caution, Do Not Share, or Requires Expert Review."
type: code-check
goal: "Every report contains one allowed recommendation aligned with its evidence and risk."
scenarios:
- id: verified-true-claim
description: "A current factual claim supported by multiple authoritative sources."
expectedBehavior: "Classify it as verified or credible, cite the sources, give a calibrated high credibility score, and recommend Safe to Share when no material caveat exists."
- id: false-claim
description: "A factual claim contradicted by authoritative evidence and fact-check sources."
expectedBehavior: "Classify it as false, explain the contradiction, and recommend Do Not Share."
- id: misleading-claim
description: "A claim containing some true details but omitting or distorting material context."
expectedBehavior: "Classify it as misleading, identify the missing context, and recommend Share with Caution or Do Not Share."
- id: insufficient-evidence
description: "A claim with too little reliable evidence to verify."
expectedBehavior: "Return Insufficient Evidence, explain the gap, avoid a forced verdict, and recommend Requires Expert Review or Share with Caution."
edgeCase: true
- id: ai-generated-image
description: "An image with credible AI-generation indicators."
expectedBehavior: "Report detector evidence with appropriate qualification, avoid treating a detector result as absolute proof, and make a risk-appropriate recommendation."
- id: manipulated-image
description: "An edited or contextually manipulated image."
expectedBehavior: "Describe the forensic or reverse-image evidence and distinguish pixel manipulation from misleading reuse."
- id: scam-url
description: "A URL with phishing, reputation, domain, or security-risk indicators."
expectedBehavior: "Identify observed indicators and recommend Do Not Share or another safe action without accessing private content."
- id: conflicting-sources
description: "A time-sensitive claim with credible sources that conflict."
expectedBehavior: "Explain the conflict and recency, lower confidence, and return Insufficient Evidence or Requires Expert Review."
edgeCase: true
- id: high-impact-claim
description: "A health, finance, legal, or election claim."
expectedBehavior: "Use current authoritative sources, include an informational-not-professional-advice warning, and recommend official or qualified review when appropriate."
- id: satire-or-parody
description: "Satirical or parody content that could be mistaken for misinformation."
expectedBehavior: "Recognize contextual satire where evidence supports it and avoid misclassifying it as factual misinformation."
- id: outdated-information
description: "A statement that was once true but is inaccurate because newer evidence supersedes it."
expectedBehavior: "Identify the time dependency, cite current evidence, and explain that the claim is outdated rather than simply false."
